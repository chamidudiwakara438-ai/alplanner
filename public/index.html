<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="AL Planner — Sri Lanka's Smart A/L & O/L Learning Platform. Plan Today, Achieve Tomorrow." />
  <title>AL Planner — Plan. Learn. Achieve</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>
  <div id="cursor-halo" hidden></div>

  <header class="topbar">
    <a class="brand" href="#/">
      <img src="/assets/logo.svg" alt="" width="40" height="40" />
      <span class="brand-txt">
        <b>AL PLANNER</b>
        <small>Plan · Learn · Achieve</small>
      </span>
    </a>
    <nav class="nav-main" id="nav-main"></nav>
    <div class="top-actions">
      <span class="greet" id="greet"></span>
      <span class="clock-pill" id="clock"></span>
      <div class="lang-pills" id="lang-pills">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="si">සිං</button>
        <button type="button" data-lang="ta">த</button>
      </div>
      <div id="auth-slot"></div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-foot">
    <div class="foot-grid">
      <div>
        <strong>AL Planner</strong>
        <p data-i="foot.about">Sri Lanka's Smart A/L &amp; O/L Learning Platform — videos, labs, practicals and a study planner.</p>
        <span class="ver-pill" id="cloud-pill">Checking save…</span>
        <button class="install-btn" id="install-btn" type="button" hidden>📲 Install app</button>
      </div>
      <div>
        <h4 data-i="foot.quick">Quick links</h4>
        <a href="#/premium">Premium</a>
        <a href="#/" id="foot-ai">Quantum AI</a>
        <a href="#/" id="foot-install">Mobile app</a>
        <a href="#/lab">AL Lab</a>
        <a href="#/zscore">Z-Score</a>
      </div>
    </div>
    <p class="copy">© 2026 AL Planner · Plan · Learn · Achieve</p>
  </footer>

  <nav class="tabbar" id="tabbar"></nav>

  <button class="ai-fab" id="ai-fab" type="button" title="Quantum AI">⚛️ Quantum AI</button>
  <div class="ai-sheet" id="ai-sheet" hidden>
    <header>
      <strong>⚛️ Quantum AI</strong>
      <button type="button" id="ai-close">✕</button>
    </header>
    <div class="ai-log" id="ai-log"></div>
    <form id="ai-form">
      <input id="ai-input" maxlength="2000" placeholder="Ask an A/L question…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/content.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/sims.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
